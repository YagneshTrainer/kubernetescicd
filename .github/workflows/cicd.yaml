name: Kubernetes CICD-pipeline

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build source code
      run: mvn clean install -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-actions@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/reviewapp:${{ github.run_number }}

    - name: Push image to docker hub 
      run: docker push ${{ secrets.DOCKERUSERNAME }}/reviewapp:${{ github.run_number }}

    - name: AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Updates EKS Kubeconfig FIle to Set EKSCLUSTER
      run: aws eks update-kubeconfig --name cicd-lab --region ap-south-1

    - name: Rolling Update with deployment
      run: kubectl set image deployment/reviewapp reviewapp=${{ secrets.DOCKER_USERNAME }}/reviewapp:${{ github.run_number }}

